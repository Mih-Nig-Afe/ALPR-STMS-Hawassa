[project]
name = "alpr-stms-hawassa"
version = "0.1.0"
description = "Phase 1 manual-enforcement traffic management platform for Hawassa City."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.15.2",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "psycopg[binary]==3.2.6",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pre-commit==4.2.0",
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/api", "services/worker", "packages/shared", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = ["services/api", "services/worker", "packages/shared"]
exclude = [
  "^tests/",
]

