name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ruff-${{ hashFiles('requirements.lock') }}

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Pin ruff to the version actually used inside the API image.
          pip install "ruff==0.11.8"

      - name: Ruff check
        run: ruff check services tests

      - name: Ruff format check
        run: ruff format --check services tests

  test:
    name: pytest (unit + integration + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure environment
        run: |
          cp .env.example .env

      - name: Build API image
        run: docker compose build api

      - name: Start database and storage stack
        run: |
          docker compose up -d supabase-db supabase-rest supabase-storage supabase-imgproxy

      - name: Wait for database health
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' supabase-db 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "supabase-db is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "supabase-db never became healthy"
          docker compose logs supabase-db
          exit 1

      - name: Run migrations
        run: docker compose run --rm api alembic upgrade head

      - name: Seed reference data
        run: docker compose run --rm api python -m app.bootstrap

      - name: Run test suite
        run: docker compose run --rm api pytest tests/unit tests/integration tests/e2e -v

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
