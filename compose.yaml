name: alpr-stms-hawassa

services:
  proxy:
    container_name: alpr-stms-proxy
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    container_name: alpr-stms-api
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVICE_ROLE: api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    container_name: alpr-stms-worker
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVICE_ROLE: worker
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import sys, time; p=Path('/tmp/worker-heartbeat'); sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 120 else 1)"
        ]
      interval: 20s
      timeout: 5s
      retries: 6

  supabase-db:
    container_name: supabase-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_USER_PASSWORD: ${DB_APP_USER_PASSWORD}
      DB_WORKER_USER: ${DB_WORKER_USER}
      DB_WORKER_USER_PASSWORD: ${DB_WORKER_USER_PASSWORD}
      DB_AUTHENTICATOR_USER: ${DB_AUTHENTICATOR_USER}
      DB_AUTHENTICATOR_USER_PASSWORD: ${DB_AUTHENTICATOR_USER_PASSWORD}
      DB_STORAGE_USER: ${DB_STORAGE_USER}
      DB_STORAGE_USER_PASSWORD: ${DB_STORAGE_USER_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]
    volumes:
      - db_data:/var/lib/postgresql/data
      - db_backups:/backups
      - ./infra/database/init/001-bootstrap-roles.sh:/docker-entrypoint-initdb.d/001-bootstrap-roles.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${DB_APP_USER}\" -d \"$${POSTGRES_DB}\" -h localhost -p \"$${POSTGRES_PORT}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  supabase-rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${POSTGREST_DATABASE_URL}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    healthcheck:
      test:
        ["CMD", "/usr/bin/sh", "-c", "read -r comm < /proc/1/comm && [ \"$$comm\" = \"postgrest\" ]"]
      interval: 10s
      timeout: 5s
      retries: 6

  supabase-storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.48.26
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_healthy
      supabase-imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${STORAGE_DATABASE_URL}
      DB_INSTALL_ROLES: "false"
      DB_SUPER_USER: ${DB_STORAGE_USER}
      DB_ANON_ROLE: anon
      DB_AUTHENTICATED_ROLE: authenticated
      DB_SERVICE_ROLE: service_role
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: ${FILE_STORAGE_BACKEND_PATH}
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase-imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  supabase-imgproxy:
    container_name: supabase-imgproxy
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    volumes:
      - storage_data:/var/lib/storage
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 6

  mailhog:
    container_name: alpr-stms-mailhog
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db_data:
  storage_data:
  db_backups:
