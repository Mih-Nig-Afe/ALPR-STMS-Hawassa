{% extends "shared/base.html" %}

{% block content %}
<section class="error-panel text-center py-5">
  <div class="error-code text-muted">{{ status_code }}</div>
  <h1 class="h3 mt-2 mb-2">{{ title }}</h1>
  <p class="text-muted mb-4">{{ description }}</p>
  <div class="d-flex flex-wrap justify-content-center gap-2">
    <a class="btn btn-primary" href="/">Return to dashboard</a>
    <button class="btn btn-outline-secondary" type="button" onclick="history.back()">Go back</button>
  </div>
  <p class="text-muted small mt-3">Requested path: {{ request.url.path }}</p>
</section>
{% endblock %}
