<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ settings.app_name }} Login</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body class="login-shell">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="login-panel shadow-sm">
            <div class="mb-4">
              <h1 class="h3 mb-1">Phase 1 Operations</h1>
              <p class="text-muted mb-0">Manual enforcement, alerts, complaints, and payments.</p>
            </div>
            {% set notice = request.query_params.get('notice') %}
            {% if notice %}
            <div class="alert alert-{{ request.query_params.get('notice_level', 'info') }}" role="alert">
              {{ notice }}
            </div>
            {% endif %}
            <form method="post" action="/auth/login" class="d-grid gap-3">
              <div>
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
              </div>
              <div>
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              </div>
              <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
            <hr class="my-4">
            <div class="small text-muted">
              <div><strong>Traffic officer:</strong> `traffic.officer1`</div>
              <div><strong>Subcity officer:</strong> `subcity.central`</div>
              <div><strong>Complaint officer:</strong> `complaints.officer`</div>
              <div><strong>Admin:</strong> `sys.admin`</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
